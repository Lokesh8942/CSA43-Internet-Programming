<html>
<body>
<h2>Hospital Appointment</h2>
<input id="name" placeholder="Patient Name">
<select id="doctor">
<option>Cardiologist</option>
<option>Dentist</option>
<option>Neurologist</option>
</select>
<input id="date" type="date">
<button onclick="book()">Book Appointment</button>
<p id="result"></p>

<script>
function book(){
 result.innerHTML="Appointment Booked!<br>"+
 name.value+"<br>"+doctor.value+"<br>"+date.value;
}
</script>
</body>
</html>
